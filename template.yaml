AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: CampusFix - Campus Infrastructure Reporting System

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    Environment:
      Variables:
        TABLE_NAME: !Ref ItemsTable

Resources:

  CampusFixFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
      Events:

        Health:
          Type: Api
          Properties:
            Path: /health
            Method: GET

        CreateItem:
          Type: Api
          Properties:
            Path: /items
            Method: POST

        ListItems:
          Type: Api
          Properties:
            Path: /items
            Method: GET

        UpdateItem:
          Type: Api
          Properties:
            Path: /items/{id}
            Method: PATCH

  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:

  ApiUrl:
    Description: CampusFix API URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  ItemsTableName:
    Description: CampusFix DynamoDB Table
    Value: !Ref ItemsTable